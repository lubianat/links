<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>redirecting…</title>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
</head>
<body>
<p id="msg">Resolving…</p>
<script>
(async () => {
  const key = new URLSearchParams(location.search).get("go");
  const msg = document.getElementById("msg");
    if (!key) { msg.innerHTML = "No key given. Links managed at <a href='https://github.com/lubianat/links'>this repository</a>."; return; }
  try {
    const res = await fetch("links.yaml", { cache: "no-cache" });
    const links = jsyaml.load(await res.text());
    const target = links[key];
    if (target) location.replace(target);
    else msg.textContent = "Unknown key: " + key;
  } catch (e) {
    msg.textContent = "Error loading links.";
  }
})();
</script>
</body>
</html>
